<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SpotMyParty — Book Your Celebration</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#111827;background:#fff}
button{font:inherit;cursor:pointer;border:0}
a{text-decoration:none;color:inherit}

.nav{

.logo{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:800}
.logo-icon{

display:grid;place-items:center;color:white;
background:linear-gradient(135deg,#6d28d9,#ec4899);
}
.logo span{background:linear-gradient(90deg,#7c3aed,#ec4899);

.navlinks{display:flex;gap:28px;color:#667085;font-size:14px}
.navlinks a:hover{color:#7c3aed}

.navbuttons{display:flex;gap:9px}
.navbuttons button{padding:10px 15px;border-radius:9px;background:white}
.dark{background:#111827!important;color:white!important}

.hero{

background:linear-gradient(180deg,#fff,#faf8ff)

.hero-content{max-width:700px}
.eyebrow{

.float{

box-shadow:0 14px 30px #10182818;font-size:16px
}
.float b{font-size:12px}

.float.top{right:0;top:5px}
.float.bottom{left:0;bottom:5px}

.section{padding:80px 7%}
.section h2{font-size:34px;letter-spacing:-1.5px;margin:8px 0 30px}

.categories{
display:grid;grid-template-columns:repeat(6,1fr);gap:13px
}
.categories button{

}
.categories button:hover{
transform:translateY(-3px);border-color:#c4b5fd;
box-shadow:0 10px 25px #1018280d
}
.categories .icon{font-size:29px;display:block;margin-bottom:20px}

.light{background:#f8f9fc}

.head{

}
.head button{background:none;color:#667085}

.grid{
display:grid;grid-template-columns:repeat(3,1fr);gap:20px
}
.card{

overflow:hidden;transition:.2s
}
.card:hover{
transform:translateY(-4px);box-shadow:0 20px 40px #10182812
}
.pic{
height:205px;display:grid;place-items:center;font-size:70px;
position:relative
}
.p1{background:#ede9fe}
.p2{background:#fce7f3}
.p3{background:#dbeafe}
.p4{background:#dcfce7}
.p5{background:#fef3c7}
.p6{background:#fee2e2}

.tag{

padding:6px 9px;border-radius:15px;font-size:9px;font-weight:800
}
.info{padding:17px}
